version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ..:/workspace:cached
      - odoo_data:/var/lib/odoo
    command: >
      odoo
      --db_host=db
      --db_user=odoo
      --db_password=odoo
      -c /workspace/odoo.conf
      -d academy
      -i base
      --without-demo=all
      --dev=all

volumes:
  pgdata:
  odoo_data:
